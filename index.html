<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Jewellery Dukan - Product List</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #FAF6F0; margin: 0; padding: 0; }
        header { background-color: #800020; color: #FFD700; text-align: center; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* Form Styling */
        .upload-section { background: white; border: 2px dashed #800020; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        .upload-section h2 { color: #800020; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-add { background-color: #800020; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-add:hover { background-color: #5a0017; }

        /* Product Gallery Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.08); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .product-title { font-size: 18px; font-weight: bold; margin: 10px 0 5px; color: #333; }
        .product-price { font-size: 16px; color: #800020; font-weight: bold; margin-bottom: 10px; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 8px 12px; border-radius: 5px; text-decoration: none; display: inline-block; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>Meri Artificial Jewellery Dukan</h1>
        <p>Aapke Shehar Ki Sabse Khoobsurat Jewellery Collection</p>
    </header>

    <div class="container">
        
        <!-- Photo Upload & Item List Form -->
        <div class="upload-section">
            <h2>Naya Samaan / Photo Add Karein</h2>
            <div class="form-group">
                <label>Item Ka Naam (e.g., Kundan Set, Jhumka):</label>
                <input type="text" id="itemName" placeholder="Item ka naam daalein">
            </div>
            <div class="form-group">
                <label>Kimat (Price in ₹):</label>
                <input type="number" id="itemPrice" placeholder="500">
            </div>
            <div class="form-group">
                <label>Photo Upload Karein:</label>
                <input type="file" id="itemImage" accept="image/*">
            </div>
            <button class="btn-add" onclick="addProduct()">List Mein Add Karein</button>
        </div>

        <!-- Products List Display -->
        <h2 style="color: #800020;">Hamari Samaan Ki List (Catalog)</h2>
        <div class="product-grid" id="productList">
            <!-- Upload kiye gaye items yahan dikhenge -->
        </div>

    </div>

    <script>
        function addProduct() {
            var name = document.getElementById('itemName').value;
            var price = document.getElementById('itemPrice').value;
            var imageInput = document.getElementById('itemImage');

            if (name === '' || price === '' || imageInput.files.length === 0) {
                alert('Kripya saari jankari daalein aur photo select karein!');
                return;
            }

            var reader = new FileReader();
            reader.onload = function (e) {
                var grid = document.getElementById('productList');
                
                var card = document.createElement('div');
                card.className = 'product-card';
                
                card.innerHTML = `
                    <img src="${e.target.result}" alt="${name}">
                    <div class="product-title">${name}</div>
                    <div class="product-price">₹${price}</div>
                    <a href="https://wa.me/919876543210?text=Mujhe%20${encodeURIComponent(name)}%20khareedna%20hai" target="_blank" class="btn-whatsapp">WhatsApp Par Order Karein</a>
                `;

                grid.appendChild(card);

                // Clear input fields
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                imageInput.value = '';
            };

            reader.readAsDataURL(imageInput.files[0]);
        }
    </script>

</body>
</html>
